# Nombre de la aplicación
spring.application.name=spring-api-rest22

# Configuración de la base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:guia-jpa
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto para Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Cada vez que se levanta la aplicación se crea la BD desde el modelo JPA
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar SQL en consola (opcional, útil para depuración)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Activar la consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console



